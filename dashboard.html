<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Agentic Security Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* ── Base ── matches login/register animated gradient bg */
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #e2e8f0;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── Glass card ── matches login/register .glass-card */
        .glass-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* ── Finding cards ── glass-tinted severity variants */
        .card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .card-high {
            background: linear-gradient(145deg, rgba(63, 22, 22, 0.7) 0%, rgba(30, 10, 10, 0.8) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid #b91c1c;
            border-left: 4px solid #ef4444;
            box-shadow: 0 8px 32px -4px rgba(185, 28, 28, 0.35);
            transform: translateY(0);
        }

        .card-high:hover {
            box-shadow: 0 12px 40px -4px rgba(239, 68, 68, 0.45);
            transform: translateY(-2px);
            border-color: #ef4444;
        }

        .card-med {
            background: linear-gradient(145deg, rgba(63, 44, 22, 0.7) 0%, rgba(30, 20, 10, 0.8) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid #a16207;
            border-left: 4px solid #f59e0b;
            box-shadow: 0 8px 32px -4px rgba(161, 98, 7, 0.35);
            transform: translateY(0);
        }

        .card-med:hover {
            box-shadow: 0 12px 40px -4px rgba(245, 158, 11, 0.45);
            transform: translateY(-2px);
            border-color: #f59e0b;
        }

        .card-low {
            background: linear-gradient(145deg, rgba(22, 36, 63, 0.7) 0%, rgba(10, 15, 30, 0.8) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid #1d4ed8;
            border-left: 4px solid #3b82f6;
            box-shadow: 0 8px 32px -4px rgba(29, 78, 216, 0.35);
            transform: translateY(0);
        }

        .card-low:hover {
            box-shadow: 0 12px 40px -4px rgba(59, 130, 246, 0.45);
            transform: translateY(-2px);
            border-color: #3b82f6;
        }

        .fixed-card {
            border: 1px solid #10b981 !important;
            background: rgba(6, 78, 59, 0.45) !important;
            backdrop-filter: blur(12px) !important;
            box-shadow: 0 4px 20px -4px rgba(16, 185, 129, 0.25) !important;
            transition: all 0.5s ease;
        }

        .active-card {
            border-color: #06b6d4 !important;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.35) !important;
            transform: scale(1.005);
        }

        /* ── Inputs ── matches login/register .glass-input */
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #22d3ee;
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.2);
            outline: none;
        }

        /* ── Buttons ── matches login/register .glow-btn */
        .btn-primary,
        .glow-btn {
            background: linear-gradient(135deg, #0891b2 0%, #0284c7 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-primary:hover,
        .glow-btn:hover {
            box-shadow: 0 0 22px rgba(8, 145, 178, 0.45);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            box-shadow: 0 0 22px rgba(5, 150, 105, 0.4);
            transform: translateY(-1px);
        }

        /* ── Code block ── */
        .code-block {
            background-color: #020617;
            border-left: 3px solid #f87171;
        }

        /* ── Stat circles ── */
        .circle-stat {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .circle-stat:hover {
            transform: scale(1.08);
            cursor: pointer;
        }

        .circle-high {
            border-color: #ef4444;
            color: #ef4444;
        }

        .circle-high:hover {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.35);
        }

        .circle-med {
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .circle-med:hover {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
        }

        .circle-low {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .circle-low:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
        }

        /* ── AI explain box ── */
        .ai-explain-box {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(8px);
            border: 1px solid #6366f1;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 0.75rem;
        }

        .ai-explain-box .ai-label {
            color: #a5b4fc;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        .ai-explain-box .ai-text {
            color: #cbd5e1;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        /* ── Confidence badges ── */
        .confidence-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            cursor: help;
        }

        .confidence-high {
            background-color: #064e3b;
            color: #34d399;
            border: 1px solid #10b981;
        }

        .confidence-med {
            background-color: #451a03;
            color: #fbbf24;
            border: 1px solid #f59e0b;
        }

        .confidence-low {
            background-color: #450a0a;
            color: #f87171;
            border: 1px solid #ef4444;
        }

        /* ── Toast system ── matches login/register */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 300px;
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            transform: translateX(120%) scale(0.9);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .toast::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            animation: toastProgress 3.5s linear forwards;
        }

        @keyframes toastProgress {
            from {
                width: 100%;
            }

            to {
                width: 0%;
            }
        }

        .toast.show {
            transform: translateX(0) scale(1);
            opacity: 1;
        }

        .toast-error {
            background: rgba(153, 27, 27, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }

        .toast-error::after {
            background: #fca5a5;
        }

        .toast-success {
            background: rgba(6, 78, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(52, 211, 153, 0.4);
            box-shadow: 0 0 20px rgba(5, 150, 105, 0.4);
        }

        .toast-success::after {
            background: #6ee7b7;
        }

        .toast-info {
            background: rgba(8, 100, 140, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 211, 238, 0.4);
            box-shadow: 0 0 20px rgba(8, 145, 178, 0.4);
        }

        .toast-info::after {
            background: #67e8f9;
        }

        /* ── Status indicator ── */
        #statusIndicator {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 211, 238, 0.25);
        }

        /* ── Header divider ── */
        .header-divider {
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* ── Section label ── */
        .section-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #475569;
        }

        /* ── Mode toggle ── */
        .mode-toggle {
            display: inline-flex;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .mode-toggle-btn {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .mode-toggle-btn:hover {
            color: #94a3b8;
        }

        .mode-toggle-btn.active {
            background: linear-gradient(135deg, rgba(8, 145, 178, 0.25) 0%, rgba(6, 182, 212, 0.15) 100%);
            color: #22d3ee;
            border: 1px solid rgba(34, 211, 238, 0.3);
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.15);
        }

        .mode-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #475569;
            margin-right: 10px;
        }

        /* ── Print styles ── */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                animation: none !important;
            }

            .no-print {
                display: none !important;
            }

            .card,
            .glass-card,
            .card-high,
            .card-med,
            .card-low,
            .fixed-card {
                border: 1px solid #999 !important;
                background: white !important;
                color: black !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
                page-break-inside: avoid;
            }

            .code-block {
                background: #f1f1f1 !important;
                color: black !important;
                border-left: 3px solid #666 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            #findingsList {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body class="p-6 max-w-6xl mx-auto flex flex-col min-h-screen">

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- ── Header ── -->
    <header class="flex justify-between items-center pb-6 mb-8 header-divider no-print">
        <div class="flex items-center gap-4">
            <!-- <div
                class="w-11 h-11 rounded-xl bg-cyan-900/40 flex items-center justify-center border border-cyan-500/25 shadow-lg">
                <span class="text-2xl"></span>
            </div> -->
            <div>
                <h1 class="text-2xl font-bold text-cyan-400 leading-tight">Agentic SAST</h1>
                <p class="section-label mt-0.5">Security Dashboard</p>
            </div>
        </div>
        <div class="flex flex-col items-end gap-2">
            <div class="text-sm text-slate-400">
                Welcome, <span id="userNameDisplay" class="text-white font-semibold mr-3">Loading...</span>
                <button onclick="logout()" class="text-cyan-500 hover:text-cyan-300 transition font-semibold">Logout
                    ➜</button>
            </div>
            <div id="statusIndicator"
                class="hidden px-4 py-1 rounded-full text-xs font-bold text-cyan-200 animate-pulse">
                System Active...
            </div>
        </div>
    </header>

    <!-- Print-only header -->
    <div class="hidden print:block mb-6">
        <h1 class="text-3xl font-bold text-black">Agentic Security Framework</h1>
        <p class="text-gray-500 mt-1">Executive Vulnerability &amp; Remediation Report</p>
    </div>

    <!-- ── Scan input ── -->
    <div class="glass-card p-6 rounded-2xl mb-10 flex gap-4 items-end no-print">
        <div class="flex-grow">
            <p class="section-label mb-2">Target Directory — Absolute Path</p>
            <input type="text" id="dirPath" class="w-full p-3 rounded-xl glass-input mono text-sm"
                placeholder="C:/Users/Project/VulnerableApp">
        </div>
        <button onclick="runScan()" class="btn-primary px-8 py-3 rounded-xl font-bold shadow-lg whitespace-nowrap">
            🔍 Scan Target
        </button>
    </div>

    <!-- ── Summary ── -->
    <div id="summaryArea" class="hidden mb-10">
        <div class="glass-card p-8 rounded-2xl">
            <p class="section-label text-center mb-1">Scan Results</p>
            <h2 class="text-3xl font-bold text-white text-center mb-8 print:text-black">
                <span id="vulnCount" class="text-cyan-400">0</span>
                <span class="text-slate-300 font-light"> Vulnerabilities Found</span>
            </h2>

            <div class="flex items-center justify-center gap-14 mb-8 no-print">
                <div class="w-44 h-44">
                    <canvas id="vulnChart"></canvas>
                </div>
                <div class="flex gap-6">
                    <div onclick="filterFindings('High')"
                        class="circle-stat circle-high w-28 h-28 rounded-full border-4 flex flex-col items-center justify-center">
                        <span id="countHigh" class="text-4xl font-bold">0</span>
                        <span class="text-xs font-bold uppercase tracking-widest mt-1">High</span>
                    </div>
                    <div onclick="filterFindings('Medium')"
                        class="circle-stat circle-med w-28 h-28 rounded-full border-4 flex flex-col items-center justify-center">
                        <span id="countMed" class="text-4xl font-bold">0</span>
                        <span class="text-xs font-bold uppercase tracking-widest mt-1">Med</span>
                    </div>
                    <div onclick="filterFindings('Low')"
                        class="circle-stat circle-low w-28 h-28 rounded-full border-4 flex flex-col items-center justify-center">
                        <span id="countLow" class="text-4xl font-bold">0</span>
                        <span class="text-xs font-bold uppercase tracking-widest mt-1">Low</span>
                    </div>
                </div>
            </div>

            <!-- Mode toggle -->
            <div class="flex items-center justify-center gap-4 mb-5 no-print">
                <span class="mode-label">Remediation Mode</span>
                <div class="mode-toggle" id="modeToggle">
                    <button onclick="setMode('manual')" id="modeManualBtn" class="mode-toggle-btn">
                        Manual
                    </button>
                    <button onclick="setMode('auto')" id="modeAutoBtn" class="mode-toggle-btn active">
                        ⚡ Auto-Fix All
                    </button>
                </div>
            </div>

            <!-- Preview Toggle -->
            <div class="flex items-center justify-center gap-4 mb-5 no-print" id="previewToggleContainer"
                style="display: none;">
                <span class="mode-label">Fix Behavior</span>
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="previewToggle" class="sr-only peer">
                    <div
                        class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-500 relative">
                    </div>
                    <span class="ml-3 text-sm font-medium text-slate-300">Preview before write</span>
                </label>
            </div>

            <div class="flex justify-center gap-4 no-print">
                <button onclick="window.print()"
                    class="bg-indigo-600/70 hover:bg-indigo-500/80 border border-indigo-400/20 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg transition flex items-center gap-2">
                    Print Report
                </button>
                <button onclick="showAllFindings()"
                    class="bg-slate-700/50 hover:bg-slate-600/60 border border-white/10 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg transition">
                    View Results
                </button>
                <button onclick="fixAll()" id="fixAllBtn"
                    class="btn-success px-6 py-2.5 rounded-xl font-semibold shadow-lg flex items-center gap-2">
                    Auto-Fix All
                </button>
            </div>
        </div>
    </div>

    <!-- ── Results ── -->
    <div id="resultsArea" class="hidden space-y-4 pb-10">
        <div class="flex items-center justify-between border-b border-white/07 pb-3 mb-2">
            <h3 id="currentViewTitle" class="section-label print:text-black">Viewing: Full Results</h3>
        </div>
        <div id="findingsList" class="space-y-4 mt-2"></div>
    </div>

    <script>
        let currentFindings = [];
        let vulnChartInstance = null;
        let currentMode = 'auto'; // 'auto' or 'manual'
        const delay = ms => new Promise(res => setTimeout(res, ms));

        /* ── Mode toggle ── */
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeManualBtn').classList.toggle('active', mode === 'manual');
            document.getElementById('modeAutoBtn').classList.toggle('active', mode === 'auto');

            // Show/hide the Auto-Fix All button
            const fixAllBtn = document.getElementById('fixAllBtn');
            fixAllBtn.style.display = mode === 'auto' ? 'flex' : 'none';

            // Show/hide preview toggle container
            const previewToggleContainer = document.getElementById('previewToggleContainer');
            if (previewToggleContainer) {
                previewToggleContainer.style.display = mode === 'manual' ? 'flex' : 'none';
            }

            // Re-render cards if results are visible to add/remove individual Fix buttons
            const resultsArea = document.getElementById('resultsArea');
            if (!resultsArea.classList.contains('hidden') && currentFindings.length > 0) {
                const titleEl = document.getElementById('currentViewTitle');
                const currentTitle = titleEl.innerText;
                // Determine what was being viewed and re-render
                if (currentTitle.includes('Full Results')) {
                    showAllFindings();
                } else {
                    const severity = currentTitle.replace('Viewing: ', '').replace(' Severity', '');
                    if (['High', 'Medium', 'Low'].includes(severity)) {
                        filterFindings(severity);
                    } else {
                        showAllFindings();
                    }
                }
            }

            const modeLabel = mode === 'manual' ? 'Manual — fix issues one at a time' : 'Auto — batch fix all issues at once';
            showToast(modeLabel, 'info');
        }

        /* ── Toast helper ── */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `<span>${icon}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        window.onload = async () => {
            try {
                const res = await fetch('/api/auth/current_user');
                const data = await res.json();
                if (data.username) { document.getElementById('userNameDisplay').innerText = data.username; }
                else { window.location.href = '/login'; }
            } catch (e) { window.location.href = '/login'; }
        };

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        function getSeverity(vulnType) {
            const t = vulnType.toLowerCase();
            if (t.includes('command injection') || t.includes('sql')) return 'High';
            if (t.includes('cross-site') || t.includes('xss')) return 'Medium';
            return 'Low';
        }

        function getSeverityColor(severity) {
            if (severity === 'High') return 'bg-red-900 text-red-200 border-red-700';
            if (severity === 'Medium') return 'bg-yellow-900 text-yellow-200 border-yellow-700';
            return 'bg-blue-900 text-blue-200 border-blue-700';
        }

        const updateStatus = (active, msg) => {
            const el = document.getElementById('statusIndicator');
            if (active) { el.innerText = msg; el.classList.remove('hidden'); }
            else { el.classList.add('hidden'); }
        };

        async function runScan() {
            const path = document.getElementById('dirPath').value.trim();
            if (!path) return showToast('Please enter a target path.', 'error');

            const btn = document.getElementById('fixAllBtn');
            btn.innerText = "Auto-Fix All";
            btn.disabled = false;
            btn.classList.replace('bg-slate-700', 'btn-success');

            updateStatus(true, "Scanning Directory...");
            document.getElementById('findingsList').innerHTML = '';
            document.getElementById('summaryArea').classList.add('hidden');
            document.getElementById('resultsArea').classList.add('hidden');

            try {
                const res = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                });
                let findings = await res.json();

                if (findings.error) { showToast(findings.error, 'error'); updateStatus(false); return; }

                findings = findings.map((f, i) => {
                    f.severity = getSeverity(f.vulnerability_type);
                    f.globalIndex = i;
                    return f;
                });
                findings.sort((a, b) => b.line_number - a.line_number);

                currentFindings = findings;
                updateSummary(findings);
                updateStatus(false);

            } catch (e) {
                showToast('Connection error — is the backend running?', 'error');
                updateStatus(false);
            }
        }

        function updateSummary(findings) {
            document.getElementById('vulnCount').innerText = findings.length;
            let counts = { High: 0, Medium: 0, Low: 0 };
            findings.forEach(f => counts[f.severity]++);

            document.getElementById('countHigh').innerText = counts.High;
            document.getElementById('countMed').innerText = counts.Medium;
            document.getElementById('countLow').innerText = counts.Low;
            document.getElementById('summaryArea').classList.remove('hidden');

            if (vulnChartInstance) vulnChartInstance.destroy();
            const ctx = document.getElementById('vulnChart').getContext('2d');
            vulnChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['High', 'Medium', 'Low'],
                    datasets: [{
                        data: [counts.High, counts.Medium, counts.Low],
                        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6'],
                        borderColor: 'rgba(15,23,42,0)', borderWidth: 3
                    }]
                },
                options: { plugins: { legend: { display: false } }, cutout: '72%' }
            });
        }

        function filterFindings(severity) {
            document.getElementById('currentViewTitle').innerText = `Viewing: ${severity} Severity`;
            const filtered = currentFindings.filter(f => f.severity === severity);
            renderFindingsCards(filtered);
            document.getElementById('resultsArea').classList.remove('hidden');
        }

        function showAllFindings() {
            document.getElementById('currentViewTitle').innerText = `Viewing: Full Results (Bottom-Up)`;
            let sorted = [...currentFindings].sort((a, b) => b.line_number - a.line_number);
            renderFindingsCards(sorted);
            document.getElementById('resultsArea').classList.remove('hidden');
        }

        function renderFindingsCards(findingsToRender) {
            const container = document.getElementById('findingsList');
            container.innerHTML = '';

            findingsToRender.forEach((f) => {
                const card = document.createElement('div');
                let cClass = f.severity === 'High' ? 'card-high' : f.severity === 'Medium' ? 'card-med' : 'card-low';

                card.className = `card p-5 rounded-2xl mb-4 ${cClass}`;
                card.id = `card-${f.globalIndex}`;

                card.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-lg border ${getSeverityColor(f.severity)}">${f.severity.toUpperCase()}</span>
                        <span class="bg-slate-800/70 text-slate-200 text-xs font-semibold px-2.5 py-1 rounded-lg border border-slate-600/50">${f.vulnerability_type}</span>
                        <span class="text-slate-500 text-xs mono">${f.file_path.split('\\').pop()}:${f.line_number}</span>
                    </div>
                    <div id="controls-${f.globalIndex}" class="no-print flex items-center gap-2 ml-2 shrink-0">
                        <button onclick="explainVuln(${f.globalIndex})" class="text-xs bg-indigo-700/80 hover:bg-indigo-600 border border-indigo-500/30 px-3 py-1.5 rounded-lg text-white font-semibold transition">Explain</button>
                        ${currentMode === 'manual'
                        ? `<button onclick="fixSingle(${f.globalIndex})" class="text-xs btn-success border border-emerald-400/30 px-3 py-1.5 rounded-lg text-white font-semibold transition">Fix</button>`
                        : `<span class="text-xs bg-slate-700/50 border border-slate-600/30 px-3 py-1.5 rounded-lg text-slate-400">Pending</span>`
                    }
                    </div>
                </div>
                <p class="text-sm text-slate-300 mb-3 print:text-black leading-relaxed">${f.description}</p>

                <div id="explain-${f.globalIndex}" class="hidden"></div>

                <pre class="code-block p-3 rounded-xl text-xs text-slate-300 mono overflow-x-auto whitespace-pre-wrap">${f.code_snippet}</pre>

                <div id="confidence-${f.globalIndex}" class="hidden mt-3"></div>

                <div id="diff-${f.globalIndex}" class="hidden mt-4 pt-4 border-t border-white/10">
                    <div class="flex items-center justify-between mb-2">
                        <p class="text-xs text-slate-400 font-bold uppercase tracking-wider print:text-black">Patch Diff (Before vs After):</p>
                        <button onclick="toggleDiffView(${f.globalIndex})" class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold transition px-3 py-1 bg-cyan-900/20 rounded-lg border border-cyan-500/20 no-print">Toggle View</button>
                    </div>
                    <div id="patched-code-${f.globalIndex}" class="font-mono text-xs bg-slate-950/80 rounded-xl border border-slate-700/50 overflow-x-auto whitespace-pre pb-2"></div>
                </div>
            `;
                container.appendChild(card);
            });
        }

        function toggleDiff(globalIndex) {
            const diffDiv = document.getElementById(`diff-${globalIndex}`);
            diffDiv.classList.toggle('hidden');
        }

        function generateSideBySideHtml(oldCode, newCode) {
            const escapeHtml = (unsafe) => unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return `
            <div class="flex flex-col md:flex-row gap-4 w-full p-2">
                <div class="flex-1 bg-slate-900/50 rounded-lg overflow-x-auto border border-slate-700/50 relative">
                    <div class="bg-slate-800 text-slate-400 px-3 py-1.5 text-[10px] font-bold uppercase border-b border-slate-700/50 sticky top-0 left-0 z-10 w-full min-w-max">Original (Vulnerable)</div>
                    <div class="p-3 text-slate-300 whitespace-pre">${escapeHtml(oldCode)}</div>
                </div>
                <div class="flex-1 bg-slate-900/50 rounded-lg overflow-x-auto border border-slate-700/50 relative">
                    <div class="bg-slate-800 text-slate-400 px-3 py-1.5 text-[10px] font-bold uppercase border-b border-slate-700/50 sticky top-0 left-0 z-10 w-full min-w-max">Patched (Secure)</div>
                    <div class="p-3 text-slate-300 whitespace-pre">${escapeHtml(newCode)}</div>
                </div>
            </div>
            `;
        }

        function renderDiffContainer(globalIndex) {
            const finding = currentFindings.find(f => f.globalIndex === globalIndex);
            if (!finding) return;
            const container = document.getElementById(`patched-code-${globalIndex}`);
            finding.diffViewMode = finding.diffViewMode || 'unified';
            if (finding.diffViewMode === 'sbs') {
                container.innerHTML = generateSideBySideHtml(finding.full_original_code, finding.new_code);
            } else {
                container.innerHTML = generateDiffHtml(finding.full_original_code, finding.new_code);
            }
        }

        function toggleDiffView(globalIndex) {
            const finding = currentFindings.find(f => f.globalIndex === globalIndex);
            if (!finding) return;
            finding.diffViewMode = finding.diffViewMode === 'sbs' ? 'unified' : 'sbs';
            renderDiffContainer(globalIndex);
        }

        function generateDiffHtml(oldCode, newCode) {
            const diff = Diff.diffLines(oldCode, newCode);
            let html = '';

            diff.forEach(part => {
                const lines = part.value.replace(/\n$/, '').split('\n');

                lines.forEach(line => {
                    const escapedLine = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    if (part.added) {
                        html += `<div class="bg-green-900/40 text-green-300 px-3 py-0.5 border-l-2 border-green-500 w-full">+ ${escapedLine}</div>`;
                    } else if (part.removed) {
                        html += `<div class="bg-red-900/40 text-red-300 px-3 py-0.5 border-l-2 border-red-500 line-through opacity-80 w-full">- ${escapedLine}</div>`;
                    } else {
                        html += `<div class="text-slate-400 px-3 py-0.5 border-l-2 border-transparent w-full">  ${escapedLine}</div>`;
                    }
                });
            });
            return html;
        }

        async function rollbackSingle(globalIndex) {
            if (!confirm("Are you sure you want to revert this patch to its original vulnerable state?")) return;
            const finding = currentFindings.find(f => f.globalIndex === globalIndex);

            try {
                updateStatus(true, "Restoring specific function...");
                const res = await fetch('/api/rollback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        file_path: finding.file_path,
                        func_name: finding.func_name,
                        original_code: finding.full_original_code
                    })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    showToast('Surgical rollback successful. Refreshing...', 'info');
                    await runScan();
                } else {
                    showToast('Rollback failed: ' + data.message, 'error');
                    updateStatus(false);
                }
            } catch (e) {
                showToast('Network error during rollback.', 'error');
                updateStatus(false);
            }
        }

        async function explainVuln(globalIndex) {
            const finding = currentFindings.find(f => f.globalIndex === globalIndex);
            if (!finding) return;
            const explainDiv = document.getElementById(`explain-${globalIndex}`);

            if (explainDiv.dataset.loaded === 'true') {
                explainDiv.classList.toggle('hidden');
                return;
            }

            explainDiv.innerHTML = `<div class="ai-explain-box"><div class="ai-label">AI Analyzing...</div><div class="ai-text animate-pulse">Generating vulnerability explanation...</div></div>`;
            explainDiv.classList.remove('hidden');

            try {
                const res = await fetch('/api/explain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        vulnerability_type: finding.vulnerability_type,
                        code_snippet: finding.code_snippet
                    })
                });
                const data = await res.json();
                if (data.explanation) {
                    explainDiv.innerHTML = `<div class="ai-explain-box"><div class="ai-label">AI Vulnerability Analysis</div><div class="ai-text">${data.explanation}</div></div>`;
                    explainDiv.dataset.loaded = 'true';
                } else {
                    explainDiv.innerHTML = `<div class="ai-explain-box"><div class="ai-label">AI Analysis</div><div class="ai-text text-red-400">Failed: ${data.error || 'Unknown error'}</div></div>`;
                }
            } catch (e) {
                explainDiv.innerHTML = `<div class="ai-explain-box"><div class="ai-label">AI Analysis</div><div class="ai-text text-red-400">Network error.</div></div>`;
            }
        }

        function renderConfidenceBadge(globalIndex, confidence, reasoning) {
            const confDiv = document.getElementById(`confidence-${globalIndex}`);
            if (!confDiv || confidence < 0) return;

            let badgeClass, icon;
            if (confidence >= 80) { badgeClass = 'confidence-high'; icon = '🟢'; }
            else if (confidence >= 50) { badgeClass = 'confidence-med'; icon = '🟡'; }
            else { badgeClass = 'confidence-low'; icon = '🔴'; }

            confDiv.innerHTML = `
            <div class="flex items-center gap-3">
                <span class="confidence-badge ${badgeClass}" title="${reasoning}">${icon} AI Confidence: ${confidence}%</span>
                <span class="text-xs text-slate-500 italic">${reasoning}</span>
            </div>
        `;
            confDiv.classList.remove('hidden');
        }

        async function fixSingle(globalIndex) {
            const finding = currentFindings.find(f => f.globalIndex === globalIndex);
            const controls = document.getElementById(`controls-${globalIndex}`);
            const card = document.getElementById(`card-${globalIndex}`);
            if (!finding || !controls || !card) return true;

            const isPreview = currentMode === 'manual' && document.getElementById('previewToggle')?.checked;

            try {
                controls.innerHTML = `<span class="text-xs bg-blue-600/70 border border-blue-400/20 px-3 py-1.5 rounded-lg text-white animate-pulse">Processing...</span>`;
                card.classList.add('active-card');

                const payload = { ...finding, preview_only: isPreview };

                const res = await fetch('/api/fix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                card.classList.remove('active-card');

                if (data.status === 'success') {
                    finding.full_original_code = data.original_code;
                    finding.func_name = data.function;
                    finding.new_code = data.new_code;

                    if (data.preview) {
                        controls.innerHTML = `
                            <button onclick="approveFix(${globalIndex})" class="text-xs bg-green-600/80 hover:bg-green-500 border border-green-400/20 px-3 py-1.5 rounded-lg text-white font-semibold transition">Approve</button>
                            <button onclick="rejectFix(${globalIndex})" class="text-xs bg-red-600/80 hover:bg-red-500 border border-red-400/20 px-3 py-1.5 rounded-lg text-white font-semibold transition">Reject</button>
                        `;
                        renderDiffContainer(globalIndex);
                        document.getElementById(`diff-${globalIndex}`).classList.remove('hidden');
                        renderConfidenceBadge(globalIndex, data.confidence, data.confidence_reasoning);
                        return true;
                    } else {
                        controls.innerHTML = `
                            <button onclick="toggleDiff(${globalIndex})" class="text-xs bg-indigo-600/80 hover:bg-indigo-500 border border-indigo-400/20 px-3 py-1.5 rounded-lg text-white font-semibold transition">Diff</button>
                            <button onclick="rollbackSingle(${globalIndex})" class="text-xs bg-yellow-600/80 hover:bg-yellow-500 border border-yellow-400/20 px-3 py-1.5 rounded-lg text-white font-semibold transition">↩Undo</button>
                            <span class="text-xs bg-green-600/80 border border-green-400/20 px-3 py-1.5 rounded-lg text-white font-semibold">Fixed</span>
                        `;

                        renderDiffContainer(globalIndex);

                        renderConfidenceBadge(globalIndex, data.confidence, data.confidence_reasoning);

                        card.classList.remove('card-high', 'card-med', 'card-low', 'card');
                        card.classList.add('fixed-card');
                        return true;
                    }
                } else {
                    controls.innerHTML = `<span class="text-xs bg-red-600/80 border border-red-400/20 px-3 py-1.5 rounded-lg text-white">Failed</span>`;
                    return false;
                }
            } catch (e) { return false; }
        }

        async function approveFix(globalIndex) {
            const finding = currentFindings.find(f => f.globalIndex === globalIndex);
            const controls = document.getElementById(`controls-${globalIndex}`);
            const card = document.getElementById(`card-${globalIndex}`);

            try {
                updateStatus(true, "Applying approved patch...");
                const res = await fetch('/api/apply_patch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        file_path: finding.file_path,
                        func_name: finding.func_name,
                        new_code: finding.new_code
                    })
                });
                const data = await res.json();
                updateStatus(false);

                if (data.status === 'success') {
                    showToast('Patch applied successfully.', 'success');
                    controls.innerHTML = `
                        <button onclick="toggleDiff(${globalIndex})" class="text-xs bg-indigo-600/80 hover:bg-indigo-500 border border-indigo-400/20 px-3 py-1.5 rounded-lg text-white font-semibold transition">Diff</button>
                        <button onclick="rollbackSingle(${globalIndex})" class="text-xs bg-yellow-600/80 hover:bg-yellow-500 border border-yellow-400/20 px-3 py-1.5 rounded-lg text-white font-semibold transition">↩Undo</button>
                        <span class="text-xs bg-green-600/80 border border-green-400/20 px-3 py-1.5 rounded-lg text-white font-semibold">Fixed</span>
                    `;
                    card.classList.remove('card-high', 'card-med', 'card-low', 'card');
                    card.classList.add('fixed-card');
                } else {
                    showToast('Failed to apply patch: ' + data.message, 'error');
                }
            } catch (e) {
                showToast('Network error while applying patch.', 'error');
                updateStatus(false);
            }
        }

        function rejectFix(globalIndex) {
            const finding = currentFindings.find(f => f.globalIndex === globalIndex);
            const controls = document.getElementById(`controls-${globalIndex}`);

            document.getElementById(`diff-${globalIndex}`).classList.add('hidden');

            controls.innerHTML = `
                <button onclick="explainVuln(${globalIndex})" class="text-xs bg-indigo-700/80 hover:bg-indigo-600 border border-indigo-500/30 px-3 py-1.5 rounded-lg text-white font-semibold transition">Explain</button>
                <button onclick="fixSingle(${globalIndex})" class="text-xs btn-success border border-emerald-400/30 px-3 py-1.5 rounded-lg text-white font-semibold transition">Fix</button>
            `;
            showToast('Patch rejected.', 'info');
        }

        async function fixAll() {
            if (!confirm("Start Autonomous Remediation? This will auto-fix all findings.")) return;
            showAllFindings();
            const mainBtn = document.getElementById('fixAllBtn');
            mainBtn.disabled = true;
            mainBtn.innerText = "Agent Running...";

            for (let i = 0; i < currentFindings.length; i++) {
                const index = currentFindings[i].globalIndex;
                updateStatus(true, `Fixing issue ${i + 1} of ${currentFindings.length}...`);
                const card = document.getElementById(`card-${index}`);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });

                await fixSingle(index);
                await delay(500);
            }
            updateStatus(false);
            mainBtn.innerText = "Done";
            mainBtn.classList.replace('btn-success', 'bg-slate-700');
            showToast('Batch remediation complete! View diffs or print the report.', 'success');
        }
    </script>
</body>

</html>
