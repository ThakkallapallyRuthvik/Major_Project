<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Agentic SAST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #e2e8f0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #22d3ee;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
        }

        .glow-btn {
            background: linear-gradient(135deg, #0891b2 0%, #0284c7 100%);
            transition: all 0.3s ease;
        }

        .glow-btn:hover {
            box-shadow: 0 0 20px rgba(8, 145, 178, 0.4);
            transform: translateY(-1px);
        }

        /* Toast System */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            min-width: 250px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-error {
            background: rgba(153, 27, 27, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        
        .toast-success {
            background: rgba(6, 78, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center py-8">

    <div id="toast-container"></div>

    <div class="w-full max-w-md p-8 rounded-2xl glass-card mx-4">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2 text-center">Create Account</h1>
        <p class="text-slate-400 text-sm text-center mb-8">Join the Agentic SAST platform.</p>
        
        <form id="regForm" onsubmit="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-xs text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Username</label>
                <input type="text" id="username" class="w-full p-3 rounded-lg glass-input text-slate-200 outline-none" placeholder="Choose a username" required>
            </div>
            <div class="mb-4">
                <label class="block text-xs text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Email Address</label>
                <input type="email" id="email" class="w-full p-3 rounded-lg glass-input text-slate-200 outline-none" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
                <label class="block text-xs text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Occupation</label>
                <select id="occupation" class="w-full p-3 rounded-lg glass-input text-slate-200 outline-none" required>
                    <option value="" disabled selected style="background: #0f172a">Select an occupation...</option>
                    <option value="student" style="background: #0f172a">Student</option>
                    <option value="teacher" style="background: #0f172a">Teacher</option>
                    <option value="engineer" style="background: #0f172a">Security Engineer</option>
                    <option value="developer" style="background: #0f172a">Software Developer</option>
                </select>
            </div>
            <div class="mb-8">
                <label class="block text-xs text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">Password</label>
                <input type="password" id="password" class="w-full p-3 rounded-lg glass-input text-slate-200 outline-none" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full py-3.5 rounded-lg font-bold text-white glow-btn relative overflow-hidden">
                <span id="btnText">Register Account</span>
            </button>
        </form>
        <div class="mt-6 text-center">
            <span class="text-sm text-slate-500">Already have an account? </span>
            <a href="/login" class="text-sm text-cyan-400 hover:text-cyan-300 font-semibold transition hover:underline">Login here</a>
        </div>
    </div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? '✅' : '⚠️';
            toast.innerHTML = `<span>${icon}</span> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btnText = document.getElementById('btnText');
            const originalText = btnText.innerText;
            btnText.innerText = "Registering...";
            
            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                occupation: document.getElementById('occupation').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showToast("Registration successful! Redirecting...", 'success');
                    setTimeout(() => window.location.href = '/login', 1500);
                } else {
                    showToast(data.error || "Registration failed");
                    btnText.innerText = originalText;
                }
            } catch(e) {
                showToast("Network Error.");
                btnText.innerText = originalText;
            }
        }
    </script>
</body>
</html>
